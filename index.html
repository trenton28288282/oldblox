<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OldBlox</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background: #87CEEB;
        }
        canvas {
            display: block;
        }
        /* Joystick */
        #joystick {
            position: fixed;
            left: 30px;
            bottom: 35px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.20);
            border: 3px solid rgba(255,255,255,0.45);
        }
        #stick {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.65);
        }
        /* Jump */
        #jump {
            position: fixed;
            right: 35px;
            bottom: 45px;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.25);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div id="joystick">
    <div id="stick"></div>
</div>
<button id="jump">JUMP</button>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
// ==========================
// SCENE
// ==========================
const scene = new THREE.Scene();
// ==========================
// CAMERA
// ==========================
const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 4, 8);
// ==========================
// RENDERER
// ==========================
const renderer =
    new THREE.WebGLRenderer();
renderer.setSize(
    window.innerWidth,
    window.innerHeight
);
document.body.appendChild(
    renderer.domElement
);
// ==========================
// SKY
// ==========================
const sky =
    new THREE.TextureLoader().load(
        "Skybox.webp"
    );
scene.background = sky;
// ==========================
// LIGHT
// ==========================
const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );
sun.position.set(
    10,
    20,
    10
);
scene.add(sun);
scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.6
    )
);
// ==========================
// BASEPLATE
// ==========================
const studs =
    new THREE.TextureLoader().load(
        "studs.png"
    );
studs.wrapS =
    THREE.RepeatWrapping;
studs.wrapT =
    THREE.RepeatWrapping;
studs.repeat.set(
    40,
    40
);
const baseplate =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            40,
            1,
            40
        ),
        new THREE.MeshLambertMaterial({
            map: studs
        })
    );
scene.add(baseplate);
// ==========================
// PLAYER
// ==========================
let velocityY = 0;
let onGround = true;
const playerHeight = 2;
camera.position.y =
    playerHeight;
// ==========================
// JOYSTICK
// ==========================
const joystick =
    document.getElementById(
        "joystick"
    );
const stick =
    document.getElementById(
        "stick"
    );
let joystickX = 0;
let joystickY = 0;
let joystickActive = false;
joystick.addEventListener(
    "touchstart",
    e => {
        joystickActive = true;
        e.preventDefault();
    },
    { passive: false }
);
joystick.addEventListener(
    "touchmove",
    e => {
        if (!joystickActive)
            return;
        const touch =
            e.touches[0];
        const rect =
            joystick.getBoundingClientRect();
        let x =
            touch.clientX -
            (rect.left + rect.width / 2);
        let y =
            touch.clientY -
            (rect.top + rect.height / 2);
        const max =
            35;
        const distance =
            Math.sqrt(
                x * x + y * y
            );
        if (distance > max) {
            x =
                x / distance * max;
            y =
                y / distance * max;
        }
        stick.style.left =
            (35 + x) + "px";
        stick.style.top =
            (35 + y) + "px";
        joystickX =
            x / max;
        joystickY =
            y / max;
        e.preventDefault();
    },
    { passive: false }
);
joystick.addEventListener(
    "touchend",
    () => {
        joystickActive = false;
        joystickX = 0;
        joystickY = 0;
        stick.style.left = "35px";
        stick.style.top = "35px";
    }
);
// ==========================
// JUMP
// ==========================
document.getElementById(
    "jump"
).addEventListener(
    "touchstart",
    e => {
        if (onGround) {
            velocityY = 0.18;
            onGround = false;
        }
        e.preventDefault();
    },
    { passive: false }
);
// ==========================
// LOOK AROUND
// ==========================
let looking = false;
let lastX = 0;
document.addEventListener(
    "touchstart",
    e => {
        if (
            e.touches[0].clientX >
            window.innerWidth / 2
        ) {
            looking = true;
            lastX =
                e.touches[0].clientX;
        }
    }
);
document.addEventListener(
    "touchmove",
    e => {
        if (!looking)
            return;
        const x =
            e.touches[0].clientX;
        const movement =
            x - lastX;
        camera.rotation.y -=
            movement * 0.005;
        lastX = x;
        e.preventDefault();
    },
    { passive: false }
);
document.addEventListener(
    "touchend",
    () => {
        looking = false;
    }
);
// ==========================
// MOVEMENT
// ==========================
function updatePlayer() {
    const speed = 0.10;
    // Forward/backward
    camera.translateZ(
        joystickY * speed
    );
    // Left/right
    camera.translateX(
        joystickX * speed
    );
    // Gravity
    velocityY -= 0.008;
    camera.position.y +=
        velocityY;
    // Ground
    if (
        camera.position.y <=
        playerHeight
    ) {
        camera.position.y =
            playerHeight;
        velocityY = 0;
        onGround = true;
    }
}
// ==========================
// RESIZE
// ==========================
window.addEventListener(
    "resize",
    () => {
        camera.aspect =
            window.innerWidth /
            window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);
// ==========================
// GAME LOOP
// ==========================
function animate() {
    requestAnimationFrame(
        animate
    );
    updatePlayer();
    renderer.render(
        scene,
        camera
    );
}
animate();
</script>
</body>
</html>
