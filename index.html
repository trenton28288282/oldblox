<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Retro Roblox Game</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
// ============================
// SCENE
// ============================
const scene = new THREE.Scene();
// ============================
// SKYBOX
// ============================
const skyTexture = new THREE.TextureLoader().load(
    "Skybox.webp"
);
skyTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTexture;
// ============================
// CAMERA
// ============================
const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 5, 10);
// ============================
// LIGHT
// ============================
const sunlight = new THREE.DirectionalLight(
    0xffffff,
    2
);
sunlight.position.set(10, 20, 10);
scene.add(sunlight);
scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.6
    )
);
// ============================
// RENDERER
// ============================
const renderer = new THREE.WebGLRenderer({
    antialias: false
});
renderer.setSize(
    window.innerWidth,
    window.innerHeight
);
renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);
document.body.appendChild(
    renderer.domElement
);
// ============================
// STUDS TEXTURE
// ============================
const textureLoader =
    new THREE.TextureLoader();
const studsTexture =
    textureLoader.load(
        "studs.png"
    );
studsTexture.colorSpace =
    THREE.SRGBColorSpace;
// Make the texture repeat
studsTexture.wrapS =
    THREE.RepeatWrapping;
studsTexture.wrapT =
    THREE.RepeatWrapping;
studsTexture.repeat.set(
    20,
    20
);
// ============================
// BASEPLATE
// ============================
const baseplateGeometry =
    new THREE.BoxGeometry(
        40,
        1,
        40
    );
const baseplateMaterial =
    new THREE.MeshLambertMaterial({
        map: studsTexture
    });
const baseplate =
    new THREE.Mesh(
        baseplateGeometry,
        baseplateMaterial
    );
baseplate.position.y = 0;
scene.add(baseplate);
// ============================
// RESIZE
// ============================
window.addEventListener(
    "resize",
    () => {
        camera.aspect =
            window.innerWidth /
            window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);
function animate() {
    requestAnimationFrame(
        animate
    );
    renderer.render(
        scene,
        camera
    );
}
animate();
</script>
</body>
</html>
