<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OldBlox</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}
canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}
/* JOYSTICK */
#joystick {
    position: fixed;
    left: 30px;
    bottom: 30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.7);
    z-index: 100;
    touch-action: none;
}
#stick {
    position: absolute;
    left: 35px;
    top: 35px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
    z-index: 101;
}
/* JUMP BUTTON */
#jump {
    position: fixed;
    right: 30px;
    bottom: 40px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.25);
    color: white;
    font-size: 16px;
    font-weight: bold;
    z-index: 100;
    touch-action: none;
}
</style>
</head>
<body>
<!-- JOYSTICK -->
<div id="joystick">
    <div id="stick"></div>
</div>
<!-- JUMP -->
<button id="jump">JUMP</button>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
// ===========================
// SCENE
// ===========================
const scene =
    new THREE.Scene();
// ===========================
// CAMERA
// ===========================
const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );
camera.position.set(
    0,
    2,
    8
);
// ===========================
// RENDERER
// ===========================
const renderer =
    new THREE.WebGLRenderer({
        antialias: false
    });
renderer.setSize(
    window.innerWidth,
    window.innerHeight
);
document.body.appendChild(
    renderer.domElement
);
// ===========================
// SKY
// ===========================
const sky =
    new THREE.TextureLoader()
    .load("Skybox.webp");
scene.background = sky;
// ===========================
// LIGHT
// ===========================
const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );
sunlight.position.set(
    10,
    20,
    10
);
scene.add(sunlight);
scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.6
    )
);
// ===========================
// BASEPLATE
// ===========================
const studs =
    new THREE.TextureLoader()
    .load("studs.png");
studs.wrapS =
    THREE.RepeatWrapping;
studs.wrapT =
    THREE.RepeatWrapping;
studs.repeat.set(
    40,
    40
);
const baseplate =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            40,
            1,
            40
        ),
        new THREE.MeshLambertMaterial({
            map: studs
        })
    );
scene.add(baseplate);
// ===========================
// PLAYER
// ===========================
let velocityY = 0;
let grounded = true;
const playerHeight = 2;
// ===========================
// JOYSTICK
// ===========================
const joystick =
    document.getElementById(
        "joystick"
    );
const stick =
    document.getElementById(
        "stick"
    );
let joyX = 0;
let joyY = 0;
let active = false;
const maxDistance = 35;
joystick.addEventListener(
    "touchstart",
    event => {
        active = true;
        event.preventDefault();
    },
    { passive: false }
);
joystick.addEventListener(
    "touchmove",
    event => {
        if (!active)
            return;
        const touch =
            event.touches[0];
        const rect =
            joystick.getBoundingClientRect();
        let x =
            touch.clientX -
            (rect.left + 60);
        let y =
            touch.clientY -
            (rect.top + 60);
        const distance =
            Math.sqrt(
                x*x + y*y
            );
        if (
            distance >
            maxDistance
        ) {
            x =
                x / distance *
                maxDistance;
            y =
                y / distance *
                maxDistance;
        }
        stick.style.left =
            (35 + x) + "px";
        stick.style.top =
            (35 + y) + "px";
        joyX =
            x / maxDistance;
        joyY =
            y / maxDistance;
        event.preventDefault();
    },
    { passive: false }
);
joystick.addEventListener(
    "touchend",
    () => {
        active = false;
        joyX = 0;
        joyY = 0;
        stick.style.left =
            "35px";
        stick.style.top =
            "35px";
    }
);
// ===========================
// JUMP
// ===========================
document.getElementById(
    "jump"
).addEventListener(
    "touchstart",
    event => {
        if (grounded) {
            velocityY =
                0.18;
            grounded =
                false;
        }
        event.preventDefault();
    },
    { passive: false }
);
// ===========================
// MOVEMENT
// ===========================
function updatePlayer() {
    const speed =
        0.10;
    camera.translateZ(
        joyY * speed
    );
    camera.translateX(
        joyX * speed
    );
    // Gravity
    velocityY -=
        0.008;
    camera.position.y +=
        velocityY;
    // Ground
    if (
        camera.position.y <=
        playerHeight
    ) {
        camera.position.y =
            playerHeight;
        velocityY = 0;
        grounded = true;
    }
}
// ===========================
// RESIZE
// ===========================
window.addEventListener(
    "resize",
    () => {
        camera.aspect =
            window.innerWidth /
            window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);
// ===========================
// GAME LOOP
// ===========================
function animate() {
    requestAnimationFrame(
        animate
    );
    updatePlayer();
    renderer.render(
        scene,
        camera
    );
}
animate();
</script>
</body>
</html>
