<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OldBlox</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}
canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}
#lookArea {
    position: fixed;
    right: 0;
    top: 0;
    width: 55%;
    height: 100%;
    z-index: 5;
    touch-action: none;
}
#joystick {
    position: fixed;
    left: 30px;
    bottom: 100px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.7);
    z-index: 10;
    touch-action: none;
}
#stick {
    position: absolute;
    left: 35px;
    top: 35px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
}
#jump {
    position: fixed;
    right: 30px;
    bottom: 100px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.25);
    color: white;
    font-size: 15px;
    font-weight: bold;
    z-index: 10;
    touch-action: none;
}
</style>
</head>
<body>
<div id="lookArea"></div>
<div id="joystick">
    <div id="stick"></div>
</div>
<button id="jump">JUMP</button>
<script type="module" src="js/main.js"></script>
</body>
</html>
