<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OldBlox</title>
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
}
canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
}
/* LEFT JOYSTICK */
#joystick {
    position: fixed;
    left: 30px;
    bottom: 30px;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 3px solid rgba(255,255,255,0.7);
    z-index: 10;
}
#stick {
    position: absolute;
    left: 35px;
    top: 35px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
}
/* JUMP */
#jump {
    position: fixed;
    right: 30px;
    bottom: 40px;
    width: 85px;
    height: 85px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.25);
    color: white;
    font-size: 15px;
    font-weight: bold;
    z-index: 10;
}
/* RIGHT SIDE CAMERA AREA */
#lookArea {
    position: fixed;
    left: 50%;
    top: 0;
    width: 50%;
    height: 100%;
    z-index: 5;
    touch-action: none;
}
</style>
</head>
<body>
<div id="lookArea"></div>
<div id="joystick">
    <div id="stick"></div>
</div>
<button id="jump">JUMP</button>
<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
// =========================
// SCENE
// =========================
const scene = new THREE.Scene();
// =========================
// CAMERA
// =========================
const camera =
    new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );
camera.position.set(0, 2, 8);
// =========================
// RENDERER
// =========================
const renderer =
    new THREE.WebGLRenderer({
        antialias: false
    });
renderer.setSize(
    window.innerWidth,
    window.innerHeight
);
document.body.appendChild(
    renderer.domElement
);
// =========================
// SKY
// =========================
const sky =
    new THREE.TextureLoader()
    .load("Skybox.webp");
scene.background = sky;
// =========================
// LIGHT
// =========================
const sunlight =
    new THREE.DirectionalLight(
        0xffffff,
        2
    );
sunlight.position.set(
    10,
    20,
    10
);
scene.add(sunlight);
scene.add(
    new THREE.AmbientLight(
        0xffffff,
        0.6
    )
);
// =========================
// BASEPLATE
// =========================
const studs =
    new THREE.TextureLoader()
    .load("studs.png");
studs.wrapS =
    THREE.RepeatWrapping;
studs.wrapT =
    THREE.RepeatWrapping;
studs.repeat.set(
    40,
    40
);
const baseplate =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            40,
            1,
            40
        ),
        new THREE.MeshLambertMaterial({
            map: studs
        })
    );
scene.add(baseplate);
// =========================
// PLAYER
// =========================
let velocityY = 0;
let grounded = true;
const playerHeight = 2;
// =========================
// JOYSTICK
// =========================
const joystick =
    document.getElementById("joystick");
const stick =
    document.getElementById("stick");
let joyX = 0;
let joyY = 0;
let joystickActive = false;
const maxDistance = 35;
joystick.addEventListener(
    "touchstart",
    e => {
        joystickActive = true;
        e.preventDefault();
    },
    { passive: false }
);
joystick.addEventListener(
    "touchmove",
    e => {
        if (!joystickActive)
            return;
        const touch = e.touches[0];
        const rect =
            joystick.getBoundingClientRect();
        let x =
            touch.clientX -
            (rect.left + 60);
        let y =
            touch.clientY -
            (rect.top + 60);
        const distance =
            Math.sqrt(x*x + y*y);
        if (distance > maxDistance) {
            x =
                x / distance *
                maxDistance;
            y =
                y / distance *
                maxDistance;
        }
        stick.style.left =
            (35 + x) + "px";
        stick.style.top =
            (35 + y) + "px";
        joyX =
            x / maxDistance;
        joyY =
            y / maxDistance;
        e.preventDefault();
    },
    { passive: false }
);
joystick.addEventListener(
    "touchend",
    () => {
        joystickActive = false;
        joyX = 0;
        joyY = 0;
        stick.style.left = "35px";
        stick.style.top = "35px";
    }
);
// =========================
// CAMERA LOOK
// =========================
const lookArea =
    document.getElementById("lookArea");
let looking = false;
let lastTouchX = 0;
let lastTouchY = 0;
let cameraYaw = 0;
let cameraPitch = 0;
lookArea.addEventListener(
    "touchstart",
    e => {
        looking = true;
        lastTouchX =
            e.touches[0].clientX;
        lastTouchY =
            e.touches[0].clientY;
        e.preventDefault();
    },
    { passive: false }
);
lookArea.addEventListener(
    "touchmove",
    e => {
        if (!looking)
            return;
        const touch =
            e.touches[0];
        const deltaX =
            touch.clientX -
            lastTouchX;
        const deltaY =
            touch.clientY -
            lastTouchY;
        lastTouchX =
            touch.clientX;
        lastTouchY =
            touch.clientY;
        // Horizontal camera rotation
        cameraYaw -=
            deltaX * 0.005;
        // Vertical camera rotation
        cameraPitch -=
            deltaY * 0.005;
        // Stop camera flipping upside down
        cameraPitch =
            Math.max(
                -1.4,
                Math.min(
                    1.4,
                    cameraPitch
                )
            );
        camera.rotation.order =
            "YXZ";
        camera.rotation.y =
            cameraYaw;
        camera.rotation.x =
            cameraPitch;
        e.preventDefault();
    },
    { passive: false }
);
lookArea.addEventListener(
    "touchend",
    () => {
        looking = false;
    }
);
// =========================
// JUMP
// =========================
document.getElementById("jump")
.addEventListener(
    "touchstart",
    e => {
        if (grounded) {
            velocityY = 0.18;
            grounded = false;
        }
        e.preventDefault();
    },
    { passive: false }
);
// =========================
// MOVEMENT
// =========================
function updatePlayer() {
    const speed = 0.10;
    // Move relative to camera direction
    camera.translateX(
        joyX * speed
    );
    camera.translateZ(
        joyY * speed
    );
    // Gravity
    velocityY -= 0.008;
    camera.position.y +=
        velocityY;
    // Ground
    if (
        camera.position.y <=
        playerHeight
    ) {
        camera.position.y =
            playerHeight;
        velocityY = 0;
        grounded = true;
    }
}
// =========================
// RESIZE
// =========================
window.addEventListener(
    "resize",
    () => {
        camera.aspect =
            window.innerWidth /
            window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);
// =========================
// GAME LOOP
// =========================
function animate() {
    requestAnimationFrame(animate);
    updatePlayer();
    renderer.render(
        scene,
        camera
    );
}
animate();
</script>
</body>
</html>
